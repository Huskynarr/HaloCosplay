      <div class="bar w-full mt-1"><i id="progress-bar"></i></div>
    </div>
    <button id="reset-btn" class="btn" title="Fortschritt loeschen">RESET</button>
  </div>

<div class="flex gap-2 px-2 py-2" style="position:relative; z-index:1;">

      <input id="search" type="search" placeholder="Guides durchsuchen..."

        class="font-mono w-full bg-[#0a1318] border text-sm px-3 py-2 outline-none"

  </aside>

  <!-- main -->
  <main class="hud hud-glow ticks flex-1 min-w-0 px-5 sm:px-8 py-7" style="min-height:calc(100vh - 80px);">

        </div>
      </div>
    </div>
  </main>
</div>
