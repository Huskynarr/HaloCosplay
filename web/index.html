<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Halo Master Chief Cosplay Guide | Vollständige Anleitung</title>
<meta name="description" content="Vollständige Schritt-für-Schritt Anleitung für den Bau eines Halo Master Chief Cosplays (MJOLNIR Rüstung V1-V3) – von EVA-Foam bis Exoskelett & Elektronik." />

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg:      #05080a;
    --bg2:     #0a1116;
    --panel:   rgba(16, 26, 31, 0.78);
    --line:    #1d2c33;
    --accent:   #5ec23f;   /* halo/xbox green */
    --accent-d: #3a7d24;
    --cyan:    #46c8ff;   /* shield blue */
    --green:   #7be0a4;
    --text:    #cdd9dc;
    --dim:     #71858c;
    --danger:  #ff5d56;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Barlow", sans-serif; font-size: 16px; line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  .font-disp { font-family: "Chakra Petch", sans-serif; }
  .font-mono { font-family: "JetBrains Mono", monospace; }

  /* atmosphere: grid + scanlines + vignette */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(70,200,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(70,200,255,0.035) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse 90% 80% at 50% 30%, #000 40%, transparent 100%);
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
    background: repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.18) 2px 3px);
    mix-blend-mode: multiply; opacity: .5;
  }

  /* angular HUD panel */
  .hud {
    position: relative; background: var(--panel);
    border: 1px solid var(--line);
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
  }
  .hud-glow { box-shadow: 0 0 0 1px rgba(70,200,255,.08), 0 14px 40px -18px rgba(0,0,0,.9); }

  /* corner ticks */
  .ticks::before, .ticks::after {
    content: ""; position: absolute; width: 10px; height: 10px; border: 2px solid var(--accent); opacity: .7;
  }
  .ticks::before { left: 6px; top: 6px; border-right: 0; border-bottom: 0; }
  .ticks::after { right: 6px; bottom: 6px; border-left: 0; border-top: 0; }

  a.navlink {
    display: block; padding: 7px 12px; color: var(--dim);
    border-left: 2px solid transparent; text-decoration: none;
    font-size: 14.5px; transition: all .15s ease;
  }
  a.navlink:hover { color: var(--text); background: rgba(70,200,255,.05); border-left-color: var(--cyan); }
  a.navlink.active { color: var(--accent); border-left-color: var(--accent); background: rgba(94,194,63,.07); }
  a.navlink.done::after { content: " OK"; color: var(--green); font-size: 11px; font-family: "JetBrains Mono", monospace; }

  .cat-head {
    font-family: "Chakra Petch", sans-serif; font-weight: 700; font-size: 11px;
    letter-spacing: .18em; text-transform: uppercase; color: var(--dim);
    padding: 14px 12px 5px; border-bottom: 1px solid var(--line); margin-bottom: 4px;
  }

  /* rendered markdown */
  .doc { max-width: 860px; }
  .doc h1 { font-family: "Chakra Petch", sans-serif; font-weight: 700; font-size: 1.9rem;
            color: #fff; letter-spacing: .01em; margin: .2em 0 .5em; line-height: 1.15; }
  .doc h2 { font-family: "Chakra Petch", sans-serif; font-weight: 600; font-size: 1.32rem;
            color: var(--accent); margin: 1.9em 0 .5em; padding-bottom: .25em;
            border-bottom: 1px solid var(--line); letter-spacing: .01em; }
  .doc h3 { font-family: "Chakra Petch", sans-serif; font-weight: 600; font-size: 1.08rem;
            color: var(--cyan); margin: 1.5em 0 .4em; }
  .doc h4 { font-weight: 600; color: #e7eef0; margin: 1.2em 0 .3em; }
  .doc p, .doc li { color: var(--text); }
  .doc a { color: var(--cyan); text-decoration: none; border-bottom: 1px dotted rgba(70,200,255,.5); }
  .doc a:hover { color: #9ee3ff; border-bottom-style: solid; }
  .doc strong { color: #fff; }
  .doc ul, .doc ol { padding-left: 1.4em; }
  .doc li { margin: .25em 0; }
  .doc blockquote {
    margin: 1.2em 0; padding: .7em 1.1em; background: rgba(70,200,255,.05);
    border-left: 3px solid var(--cyan); color: var(--text);
  }
  .doc code {
    font-family: "JetBrains Mono", monospace; font-size: .86em;
    background: #0c1419; border: 1px solid var(--line); padding: .1em .4em; border-radius: 3px; color: var(--green);
  }
  .doc pre {
    background: #0a1015; border: 1px solid var(--line); border-left: 3px solid var(--accent);
    padding: 1em 1.1em; overflow-x: auto; margin: 1.2em 0;
  }
  .doc pre code { background: none; border: 0; padding: 0; color: #cdd9dc; }
  .doc img { max-width: 100%; height: auto; border: 1px solid var(--line); background: #0b1216; margin: 1em 0; }
  .doc table { border-collapse: collapse; width: 100%; margin: 1.2em 0; font-size: 14.5px; display: block; overflow-x: auto; }
  .doc th, .doc td { border: 1px solid var(--line); padding: .5em .7em; text-align: left; vertical-align: top; }
  .doc th { background: rgba(94,194,63,.08); color: var(--accent); font-family: "Chakra Petch", sans-serif;
            text-transform: uppercase; font-size: 12px; letter-spacing: .05em; }
  .doc tr.bought td { opacity: .45; text-decoration: line-through; }
  .doc hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }

  /* task + buy checkboxes */
  .doc input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; vertical-align: -2px; margin-right: .4em; }
  .doc li:has(> input[type="checkbox"]) { list-style: none; margin-left: -1.1em; }

  /* progress / shield bar */
  .bar { height: 8px; background: #0c1a1f; border: 1px solid var(--line); position: relative; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, var(--accent-d), var(--accent)); box-shadow: 0 0 12px rgba(94,194,63,.6);
    transition: width .5s cubic-bezier(.2,.8,.2,1); }

  .btn { font-family: "Chakra Petch", sans-serif; font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase;
    padding: 8px 16px; border: 1px solid var(--line); color: var(--text); background: rgba(70,200,255,.04);
    cursor: pointer; transition: all .15s; clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px)); }
  .btn:hover { border-color: var(--cyan); color: #fff; background: rgba(70,200,255,.12); }
  .btn-accent { border-color: var(--accent); color: var(--accent); }
  .btn-accent:hover { background: rgba(94,194,63,.15); color: #fff; }
  .btn[disabled] { opacity: .3; cursor: not-allowed; }

  .glitch-in { animation: gin .35s ease both; }
  @keyframes gin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* scrollbars */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #070d10; }
  ::-webkit-scrollbar-thumb { background: #1d2c33; border: 2px solid #070d10; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent-d); }

  @media (max-width: 1024px) {
    #sidebar { position: fixed; inset: 0 auto 0 0; z-index: 50; width: 290px; transform: translateX(-100%);
      transition: transform .25s ease; background: var(--bg2); }
    #sidebar.open { transform: none; }
    #backdrop.open { display: block; }
  }
</style>
</head>
<body class="min-h-screen">

<!-- top HUD bar -->
<header class="hud hud-glow ticks sticky top-0 z-40 mx-2 mt-2 px-4 py-2.5 flex items-center gap-4" style="background:#070f13;">
  <button id="menu-toggle" class="btn lg:hidden" aria-label="Menue">=</button>
  <div class="flex items-center gap-3 min-w-0">
    <div class="font-disp font-bold text-white text-lg leading-none tracking-wider" style="text-shadow:0 0 14px rgba(94,194,63,.4);">
      MASTER CHIEF<span style="color:var(--accent)">//</span>COSPLAY GUIDE
    </div>
  </div>
  <div class="ml-auto flex items-center gap-3 min-w-0">
    <div class="hidden sm:flex flex-col items-end" style="min-width:160px;">
      <div class="font-mono text-[10px] tracking-widest" style="color:var(--dim)">MISSION PROGRESS <span id="progress-pct" style="color:var(--accent)">0%</span></div>
      <div class="bar w-full mt-1"><i id="progress-bar"></i></div>
    </div>
    <button id="reset-btn" class="btn" title="Fortschritt loeschen">RESET</button>
  </div>
</header>

<div class="flex gap-2 px-2 py-2" style="position:relative; z-index:1;">
  <!-- sidebar -->
  <aside id="sidebar" class="hud shrink-0 w-[290px] self-start lg:sticky" style="top:70px; max-height:calc(100vh - 80px); overflow-y:auto;">
    <div class="p-2">
      <input id="search" type="search" placeholder="Guides durchsuchen..."
        class="font-mono w-full bg-[#0a1318] border text-sm px-3 py-2 outline-none"
        style="border-color:var(--line); color:var(--text);" />
    </div>
    <nav id="nav" class="pb-6"></nav>
  </aside>
  <div id="backdrop" onclick="window.__closeNav&&window.__closeNav()" class="hidden fixed inset-0 z-40" style="background:rgba(0,0,0,.6);"></div>

  <!-- main -->
  <main class="hud hud-glow ticks flex-1 min-w-0 px-5 sm:px-8 py-7" style="min-height:calc(100vh - 80px);">
    <article id="doc" class="doc mx-auto"></article>

    <!-- journey footer -->
    <div id="journey-foot" class="doc mx-auto mt-10 pt-5" style="border-top:1px solid var(--line); display:none;">
      <div class="flex items-center justify-between gap-3 flex-wrap">
        <button id="done-toggle" class="btn btn-accent">Schritt erledigt</button>
        <div class="flex gap-2">
          <button id="prev-btn" class="btn">&lt; Zurueck</button>
          <button id="next-btn" class="btn">Weiter &gt;</button>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="toast" class="font-mono fixed bottom-4 left-1/2 -translate-x-1/2 z-[10000] px-4 py-2 text-sm hud"
  style="background:#0c1a14; border-color:var(--green); color:var(--green); display:none;"></div>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
