<text x="60" y="428" class="small" text-anchor="start">B30...B35: Eingang bei Reset hochohmig -&gt; R30...R35 ziehen A LOW; /OE dauerhaft an E_GND.</text>
<text x="60" y="454" class="small" text-anchor="start">DIM nicht mit 10-kohm-Pulldown allein absichern: offener LDD-DIM-Eingang bedeutet EIN.</text>
<text x="60" y="480" class="small" text-anchor="start">Direkter 5-V-Pufferausgang; DIM-Strom/LOW-Pegel real messen. Kein Ioff-Nachweis fuer den Puffer.</text>
<text x="65" y="539" class="body" text-anchor="start">Relais-Freigabe / Gate LOW bei getrenntem MCU oder offener Temperaturkontaktkette</text>
