<text x="1360" y="706" class="small" text-anchor="start">1N4007</text>
<text x="60" y="874" class="body" text-anchor="start">J30: 1 E_GND, 2 READY, 3 H_R, 4 H_G, 5 H_B, 6 N_R, 7 N_G, 8 N_B. Nur 3,3-V-Signale.</text>
<text x="60" y="914" class="small" text-anchor="start">J22: 1 E5_CTRL, 2 E_GND. Controller braucht dokumentierten 5-V-Eingang und eigene 3,3-V-Regelung.</text>
<text x="60" y="953" class="small" text-anchor="start">Reset-AUS gilt stationaer bei hochohmigen GPIOs; Brownout, Kontaktprellen und Abschaltimpulse messen.</text>
<text x="60" y="986" class="small" text-anchor="start">Temperatursperre/Watchdog/MCU-Pinwahl noch nicht implementiert. Kein Sicherheitsrelais, kein Not-Halt.</text>
