name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Doku-Checks (ASCII + Links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ASCII-Konvention pruefen
        run: |
          if grep -rlP '[^\x00-\x7F]' --include='*.md' --include='*.ino' --include='*.py' .; then
            echo '::error::Nicht-ASCII-Zeichen gefunden. Konvention: ae/oe/ue statt Umlaute, ss statt sz, - statt Gedankenstrich.'
            exit 1
          fi
          echo "ASCII OK"

      - name: Relative Markdown-Links pruefen
        run: |
          status=0
          while IFS=: read -r file rest; do
            link=$(printf '%s' "$rest" | sed -E 's/^[0-9]+:\]\((.*)\)$/\1/' | sed 's/#.*//')
            [ -z "$link" ] && continue
            dir=$(dirname "$file")
            if [ ! -e "$dir/$link" ] && [ ! -e "$link" ]; then
              echo "::error file=$file::Defekter relativer Link: $link"
              status=1
            fi
          done < <(grep -rnoP '\]\((?!https?://|#|mailto:)[^)]+\)' --include='*.md' . || true)
          [ $status -eq 0 ] && echo "Links OK"
          exit $status

      - name: Sitemap aktuell
        run: python3 tools/suit_sitemap.py --check

  python:
    name: Python Syntax-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Alle Python-Dateien kompilieren
        run: python -m compileall -q Code/

      - name: Lint (Syntaxfehler, undefinierte Namen, ungenutzte Importe)
        run: |
          python -m pip install --quiet ruff==0.17.6
          ruff check --select E9,F tools Code Tests Design

      - name: Hardwarefreie Selftests (HUD, Bridges, Sprachsteuerung)
        run: |
          python -m pip install --quiet Pillow
          cd Code/HelmetControl
          python hud_display.py --selftest /tmp/hud.png
          python sensor_bridge.py --selftest --state /tmp/s.json --battery /tmp/b.json
          python robot_bridge.py --selftest --state /tmp/r.json
          python vision_bridge.py --selftest --state /tmp/v.json
          python voice_control.py --selftest

  firmware:
    name: Firmware-Logik auf dem Host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sketches gegen Mock-Arduino uebersetzen und testen
        run: python3 Tests/Firmware/run.py

  arduino:
    name: Arduino-Sketches kompilieren
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Der Job laeuft immer (bleibt als Pflicht-Check nutzbar), kompiliert bei
      # Pull Requests aber nur, wenn Sketches oder dieser Workflow geaendert wurden.
      - name: Betroffene Dateien pruefen
        id: changed
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^1 HEAD | grep -qE '\.(ino|h|cpp)$|^\.github/workflows/ci\.yml$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Keine Sketch-Aenderungen, Kompilierung uebersprungen."
          fi

      - uses: arduino/setup-arduino-cli@v2
        if: steps.changed.outputs.run == 'true'

      - name: Cores und Libraries cachen
        if: steps.changed.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.arduino15
          key: arduino15-avr-esp32-3.3.13

      - name: Cores installieren
        if: steps.changed.outputs.run == 'true'
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install arduino:avr
          # Fest auf 3.3.x: Core 4.0 ersetzt die BLEDevice-API (cortana_chip.ino) durch BLE.h
          arduino-cli core install esp32:esp32@3.3.13 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Libraries installieren
        if: steps.changed.outputs.run == 'true'
        run: arduino-cli lib install "Adafruit NeoPixel" "Adafruit GFX Library" "Adafruit SSD1306" "JC_Button" "ArduinoJson"

      - name: AVR-Sketches kompilieren (Arduino Nano)
        if: steps.changed.outputs.run == 'true'
        run: |
          fail=0
          for f in Code/Examples/HelmetControl/MainControlCode.ino \
                   Code/HelmetControl/HelmetMultiEffects.ino \
                   Code/Examples/HelmetControl/LightingEffectsCode.ino \
                   Code/Examples/ArmorControl/MainControlCode.ino \
                   Code/ArmorControl/MultiEffects.ino \
                   Code/Examples/ArmorControl/LightingEffectsCode.ino \
                   Code/WeaponControl/ammo_counter.ino; do
            name=$(basename "$f" .ino)
            tmp=$(mktemp -d)
            mkdir "$tmp/$name"
            cp "$f" "$tmp/$name/"
            echo "::group::$f"
            arduino-cli compile --fqbn arduino:avr:nano "$tmp/$name" || { echo "::error file=$f::Kompilierung fehlgeschlagen"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail

      - name: ESP32-Sketch kompilieren (SensorFeeder)
        if: steps.changed.outputs.run == 'true'
        run: arduino-cli compile --fqbn esp32:esp32:esp32 Code/HelmetControl/AR/SensorFeeder

      - name: ESP32-Sketch kompilieren (Beinantrieb X01)
        if: steps.changed.outputs.run == 'true'
        run: arduino-cli compile --fqbn esp32:esp32:esp32 Code/ExoControl/LegAssist

      - name: ESP32-S3-Sketch kompilieren (Cortana-Chip)
        if: steps.changed.outputs.run == 'true'
        run: |
          tmp=$(mktemp -d)
          mkdir "$tmp/cortana_chip"
          cp Code/CortanaChip/cortana_chip.ino "$tmp/cortana_chip/"
          arduino-cli compile --fqbn esp32:esp32:esp32s3 "$tmp/cortana_chip"
