name: MJOLNIR design checks

on:
  push:
    branches: [main]
    paths: ['Design/Parametric/**', 'Design/Components/**', 'Design/HardwareKit/**', 'Design/Electrical/**', 'Design/Clamshell/**', 'Design/Exo/**', 'Design/Engineering/**', 'Design/Thermal/**', 'Documentation/References/ArmorReferenceLibrary.json', 'web/configurator/**', 'web/budget/**', 'web/products/**', 'web/app.js', 'web/guide.js', 'web/vendor/**', 'web/fonts/**', 'sw.js', 'tools/tailwind.*', 'web/content.js', 'web/index.html', 'web/monitoring.js', 'web/cortana/**', 'Materials/ProductCatalog.json', 'Materials/Einkaufsliste-Links.md', 'Progress/Mjolnir-*', 'Code/Exhibition/**', 'tools/suit_*.py', 'Materials/Mjolnir*', 'Tests/Automation/**', 'Tests/Browser/**', '.github/workflows/suit-design.yml']
  pull_request:
    paths: ['Design/Parametric/**', 'Design/Components/**', 'Design/HardwareKit/**', 'Design/Electrical/**', 'Design/Clamshell/**', 'Design/Exo/**', 'Design/Engineering/**', 'Design/Thermal/**', 'Documentation/References/ArmorReferenceLibrary.json', 'web/configurator/**', 'web/budget/**', 'web/products/**', 'web/app.js', 'web/guide.js', 'web/vendor/**', 'web/fonts/**', 'sw.js', 'tools/tailwind.*', 'web/content.js', 'web/index.html', 'web/monitoring.js', 'web/cortana/**', 'Materials/ProductCatalog.json', 'Materials/Einkaufsliste-Links.md', 'Progress/Mjolnir-*', 'Code/Exhibition/**', 'tools/suit_*.py', 'Materials/Mjolnir*', 'Tests/Automation/**', 'Tests/Browser/**', '.github/workflows/suit-design.yml']

permissions:
  contents: read

jobs:
  calculations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s Tests/Automation -v
      - run: python -m unittest discover -s Design/Electrical -p 'test_*.py' -v
      - run: python tools/suit_catalog.py --check
      - run: python tools/suit_budget.py --check
      - run: python tools/suit_readiness.py --check
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test Tests/Automation/*.test.cjs
      - run: python -m compileall -q tools/suit_*.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Exclude unused Chrome apt repository from runner dependencies
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          # Playwright downloads its own Chromium; keep Ubuntu signature/hash checks.
          for source in Path('/etc/apt/sources.list.d').iterdir():
              if source.suffix in ('.list', '.sources') and 'dl.google.com/linux/chrome' in source.read_text():
                  source.rename(source.with_suffix(source.suffix + '.disabled'))
          PY
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --prefix build/browser playwright@1.62.1
          node build/browser/node_modules/playwright/cli.js install --with-deps chromium --only-shell
      - name: Prebuilt Tailwind stylesheet is current
        run: |
          npx --yes tailwindcss@3.4.17 -c tools/tailwind.config.cjs -i tools/tailwind.input.css -o build/tailwind-check.css --minify
          cmp build/tailwind-check.css web/vendor/tailwind.css || {
            echo '::error::web/vendor/tailwind.css is stale; rebuild it (command in web/vendor/README.md)'; exit 1; }
      - name: Verify interactive project workflows
        env:
          NODE_PATH: ${{ github.workspace }}/build/browser/node_modules
        run: node Tests/Browser/smoke.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: project-interface-screenshots
          path: build/browser-results/
          if-no-files-found: ignore

  cad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Exclude unused Chrome apt repository from runner dependencies
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          # OpenSCAD comes from Ubuntu; keep repository signature/hash checks.
          for source in Path('/etc/apt/sources.list.d').iterdir():
              if source.suffix in ('.list', '.sources') and 'dl.google.com/linux/chrome' in source.read_text():
                  source.rename(source.with_suffix(source.suffix + '.disabled'))
          PY
      - name: Install OpenSCAD
        run: sudo apt-get update -qq && sudo apt-get install -y openscad
      - name: Compile concept poses and test coupons
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p build
          python3 tools/suit_fit.py --profile Design/Parametric/Profiles/Demo.json --concept --out build/PortableSuit
          openscad --hardwarnings -o "$GITHUB_WORKSPACE/build/portable.csg" "$GITHUB_WORKSPACE/build/PortableSuit/MjolnirEntry.scad"
          test -s "$GITHUB_WORKSPACE/build/portable.csg"
          for pose in 0 0.25 0.5 1; do
            openscad --hardwarnings -o "$GITHUB_WORKSPACE/build/suit-${pose}.csg" -D "open_fraction=${pose}" Design/Parametric/MjolnirEntry.scad
            test -s "$GITHUB_WORKSPACE/build/suit-${pose}.csg"
          done
          openscad --hardwarnings -o build/forearm-ring.stl -D 'view="forearm_ring"' Design/Parametric/MjolnirEntry.scad
          openscad --hardwarnings -o build/hole-coupon.stl -D 'view="hardware"' Design/Parametric/MjolnirEntry.scad
          test -s build/forearm-ring.stl
          test -s build/hole-coupon.stl
      - name: Generate workshop package and compile six component prototypes
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 tools/suit_project.py --profile Design/Parametric/Profiles/Demo.json --concept --out build/WorkshopDemo
          for component in visor_retainer fan_bracket seam_coupon joint_cover hinge_coupon magnet_mount; do
            openscad --hardwarnings -D "component=\"${component}\"" -o "build/WorkshopDemo/Components/${component}.stl" build/WorkshopDemo/Components/ComponentKit.scad
            test -s "build/WorkshopDemo/Components/${component}.stl"
          done
          python3 -m unittest discover -s Tests/Automation -p test_components.py -v
          for part in base base_lid mate mate_lid; do
            openscad --hardwarnings -D 'component="magnet_mount"' -D "magnet_part=\"${part}\"" -o "build/WorkshopDemo/Components/magnet_${part}.stl" build/WorkshopDemo/Components/ComponentKit.scad
            test -s "build/WorkshopDemo/Components/magnet_${part}.stl"
          done
      - name: Validate electrical references and export accessory meshes
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 Design/Electrical/generate.py --check
          python3 tools/suit_hardware.py --out build/HardwareDemo --render-stl
          python3 -m zipfile -c build/HaloCosplay-CAD-Schaltplaene.zip build/HardwareDemo
      - name: Compile X01 mechanics concept
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p build/X01
          for pose in "hip_flex_deg=0" "hip_flex_deg=-36" "hip_flex_deg=112" "abduction_deg=20"; do
            openscad --hardwarnings -D "$pose" -o "build/X01/assembly_${pose%%=*}_${pose##*=}.stl" Design/Exo/X01Frame.scad
            test -s "build/X01/assembly_${pose%%=*}_${pose##*=}.stl"
          done
          for part in motor_plate output_arm strut cuff pelvis_frame; do
            for side in l r; do
              openscad --hardwarnings -D "part=\"${part}\"" -D "side=\"${side}\"" -o "build/X01/${part}_${side}.stl" Design/Exo/X01Frame.scad
              test -s "build/X01/${part}_${side}.stl"
            done
          done
      - name: Compile left and right opening limb envelopes
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          for part in upperarm forearm thigh shin; do
            for side in l r; do
              for pose in 0 1; do
                file="build/WorkshopDemo/Clamshell/${part}_${side}_${pose}.stl"
                openscad --hardwarnings -D "part=\"${part}\"" -D "side=\"${side}\"" -D "open_fraction=${pose}" -o "$file" build/WorkshopDemo/Clamshell/LimbClamshell.scad
                test -s "$file"
              done
            done
          done
          for side in l r; do
            for pose in 0 1; do
              file="build/WorkshopDemo/Clamshell/arm_module_${side}_${pose}.stl"
              openscad --hardwarnings -D "side=\"${side}\"" -D "open_fraction=${pose}" -D "elbow_flex_deg=$((pose * 60))" -o "$file" build/WorkshopDemo/Clamshell/ArmModule.scad
              test -s "$file"
            done
            for segment in upperarm forearm; do
              for piece in rear front; do
                file="build/WorkshopDemo/Clamshell/arm_module_${side}_${segment}_${piece}.stl"
                openscad --hardwarnings -D "side=\"${side}\"" -D "segment=\"${segment}\"" -D "piece=\"${piece}\"" -o "$file" build/WorkshopDemo/Clamshell/ArmModule.scad
                test -s "$file"
              done
            done
          done
      - uses: actions/upload-artifact@v7
        with:
          name: concept-only-not-fabrication-approved
          path: build/
