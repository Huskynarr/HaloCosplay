name: MJOLNIR design checks

on:
  push:
    branches: [main]
    paths: ['Design/Parametric/**', 'Design/Components/**', 'Design/Clamshell/**', 'Design/Engineering/**', 'Design/Thermal/**', 'Documentation/References/ArmorReferenceLibrary.json', 'web/configurator/**', 'web/budget/**', 'Progress/Mjolnir-*', 'Code/Exhibition/**', 'tools/suit_*.py', 'Materials/Mjolnir*', 'Tests/Automation/**', 'Tests/Browser/**', '.github/workflows/suit-design.yml']
  pull_request:
    paths: ['Design/Parametric/**', 'Design/Components/**', 'Design/Clamshell/**', 'Design/Engineering/**', 'Design/Thermal/**', 'Documentation/References/ArmorReferenceLibrary.json', 'web/configurator/**', 'web/budget/**', 'Progress/Mjolnir-*', 'Code/Exhibition/**', 'tools/suit_*.py', 'Materials/Mjolnir*', 'Tests/Automation/**', 'Tests/Browser/**', '.github/workflows/suit-design.yml']

permissions:
  contents: read

jobs:
  calculations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s Tests/Automation -v
      - run: python tools/suit_budget.py --check
      - run: python tools/suit_readiness.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test Tests/Automation/*.test.cjs
      - run: python -m compileall -q tools/suit_*.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exclude unused Chrome apt repository from runner dependencies
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          # Playwright downloads its own Chromium; keep Ubuntu signature/hash checks.
          for source in Path('/etc/apt/sources.list.d').iterdir():
              if source.suffix in ('.list', '.sources') and 'dl.google.com/linux/chrome' in source.read_text():
                  source.rename(source.with_suffix(source.suffix + '.disabled'))
          PY
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --prefix build/browser playwright@1.62.1
          node build/browser/node_modules/playwright/cli.js install --with-deps chromium --only-shell
      - name: Verify interactive project workflows
        env:
          NODE_PATH: ${{ github.workspace }}/build/browser/node_modules
        run: node Tests/Browser/smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-interface-screenshots
          path: build/browser-results/
          if-no-files-found: ignore

  cad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exclude unused Chrome apt repository from runner dependencies
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          # OpenSCAD comes from Ubuntu; keep repository signature/hash checks.
          for source in Path('/etc/apt/sources.list.d').iterdir():
              if source.suffix in ('.list', '.sources') and 'dl.google.com/linux/chrome' in source.read_text():
                  source.rename(source.with_suffix(source.suffix + '.disabled'))
          PY
      - name: Install OpenSCAD
        run: sudo apt-get update -qq && sudo apt-get install -y openscad
      - name: Compile concept poses and test coupons
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p build
          python3 tools/suit_fit.py --profile Design/Parametric/Profiles/Demo.json --concept --out build/PortableSuit
          openscad --hardwarnings -o "$GITHUB_WORKSPACE/build/portable.csg" "$GITHUB_WORKSPACE/build/PortableSuit/MjolnirEntry.scad"
          test -s "$GITHUB_WORKSPACE/build/portable.csg"
          for pose in 0 0.25 0.5 1; do
            openscad --hardwarnings -o "$GITHUB_WORKSPACE/build/suit-${pose}.csg" -D "open_fraction=${pose}" Design/Parametric/MjolnirEntry.scad
            test -s "$GITHUB_WORKSPACE/build/suit-${pose}.csg"
          done
          openscad --hardwarnings -o build/forearm-ring.stl -D 'view="forearm_ring"' Design/Parametric/MjolnirEntry.scad
          openscad --hardwarnings -o build/hole-coupon.stl -D 'view="hardware"' Design/Parametric/MjolnirEntry.scad
          test -s build/forearm-ring.stl
          test -s build/hole-coupon.stl
      - name: Generate workshop package and compile five component prototypes
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 tools/suit_project.py --profile Design/Parametric/Profiles/Demo.json --concept --out build/WorkshopDemo
          for component in visor_retainer fan_bracket seam_coupon joint_cover hinge_coupon; do
            openscad --hardwarnings -D "component=\"${component}\"" -o "build/WorkshopDemo/Components/${component}.stl" build/WorkshopDemo/Components/ComponentKit.scad
            test -s "build/WorkshopDemo/Components/${component}.stl"
          done
      - name: Compile left and right opening limb envelopes
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          for part in upperarm forearm thigh shin; do
            for side in l r; do
              for pose in 0 1; do
                file="build/WorkshopDemo/Clamshell/${part}_${side}_${pose}.stl"
                openscad --hardwarnings -D "part=\"${part}\"" -D "side=\"${side}\"" -D "open_fraction=${pose}" -o "$file" build/WorkshopDemo/Clamshell/LimbClamshell.scad
                test -s "$file"
              done
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: concept-only-not-fabrication-approved
          path: build/
