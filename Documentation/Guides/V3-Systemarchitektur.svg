<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="680" viewBox="0 0 980 680">
  <defs>
    <style>
      .box  { fill: #f5f5f5; stroke: #333; stroke-width: 2; }
      .src  { fill: #e8eef7; stroke: #333; stroke-width: 2; }
      .merge{ fill: #eef7ee; stroke: #333; stroke-width: 2; }
      .pwr  { fill: #f7efe8; stroke: #333; stroke-width: 2; }
      .note { fill: #fffbe6; stroke: #b9a93a; stroke-width: 1.5; }
      .label{ font-family: Arial, sans-serif; font-size: 14px; fill: #222; }
      .small{ font-family: Arial, sans-serif; font-size: 11px; fill: #555; }
      .head { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #111; }
      .zone { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #777; }
      .line { stroke: #333; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333" />
    </marker>
  </defs>

  <text class="head" x="24" y="30">MJOLNIR V3 - System Architecture</text>
  <text class="small" x="24" y="48">Decoupled modules. Data/control flow (top), three power rails (bottom). Details: V3-Systemarchitektur.md</text>

  <!-- ================= DATA &amp; CONTROL ================= -->
  <text class="zone" x="24" y="78">DATA &amp; CONTROL FLOW</text>

  <!-- sources -->
  <rect class="src" x="24" y="90" width="170" height="46" />
  <text class="label" x="38" y="112">SensorFeeder</text>
  <text class="small" x="38" y="127">ESP32 (IMU, batt)</text>

  <rect class="src" x="24" y="168" width="170" height="46" />
  <text class="label" x="38" y="190">Companion Robot</text>
  <text class="small" x="38" y="205">Unitree Go2 (opt.)</text>

  <!-- bridges -->
  <rect class="box" x="250" y="90" width="170" height="46" />
  <text class="label" x="264" y="118">sensor_bridge.py</text>

  <rect class="box" x="250" y="168" width="170" height="46" />
  <text class="label" x="264" y="196">robot_bridge.py</text>

  <!-- merge -->
  <rect class="merge" x="476" y="112" width="170" height="80" />
  <text class="label" x="490" y="140">hud_state.json</text>
  <text class="small" x="490" y="158">+ battery.json</text>
  <text class="small" x="490" y="178">shield/ammo/heading</text>

  <!-- hud + oled -->
  <rect class="box" x="702" y="100" width="170" height="46" />
  <text class="label" x="716" y="128">hud_display.py</text>

  <rect class="box" x="702" y="170" width="170" height="46" />
  <text class="label" x="716" y="192">OLED HUD</text>
  <text class="small" x="716" y="207">128x64 SSD1309</text>

  <!-- arrows: sources -> bridges -->
  <line class="line" x1="194" y1="113" x2="250" y2="113" marker-end="url(#arrow)" />
  <text class="small" x="196" y="108">serial JSON</text>
  <line class="line" x1="194" y1="191" x2="250" y2="191" marker-end="url(#arrow)" />
  <text class="small" x="196" y="186">WLAN/UDP</text>

  <!-- arrows: bridges -> merge -->
  <line class="line" x1="420" y1="113" x2="476" y2="138" marker-end="url(#arrow)" />
  <line class="line" x1="420" y1="191" x2="476" y2="166" marker-end="url(#arrow)" />

  <!-- arrows: merge -> hud -> oled -->
  <line class="line" x1="646" y1="140" x2="702" y2="123" marker-end="url(#arrow)" />
  <text class="small" x="650" y="120">poll</text>
  <line class="line" x1="787" y1="146" x2="787" y2="170" marker-end="url(#arrow)" />
  <text class="small" x="792" y="164">draw</text>

  <!-- control row: helmet_control -> arduino -> leds/fans -->
  <rect class="box" x="24" y="250" width="170" height="46" />
  <text class="label" x="38" y="272">helmet_control.py</text>
  <text class="small" x="38" y="287">on the Pi</text>

  <rect class="box" x="250" y="250" width="170" height="46" />
  <text class="label" x="264" y="272">Helmet Arduino</text>
  <text class="small" x="264" y="287">I2C slave 0x08</text>

  <rect class="box" x="476" y="250" width="170" height="46" />
  <text class="label" x="490" y="272">Visor LEDs + Fans</text>

  <line class="line" x1="194" y1="273" x2="250" y2="273" marker-end="url(#arrow)" />
  <text class="small" x="196" y="268">I2C cmd</text>
  <line class="line" x1="420" y1="273" x2="476" y2="273" marker-end="url(#arrow)" />

  <!-- thruster row -->
  <rect class="box" x="24" y="330" width="170" height="46" />
  <text class="label" x="38" y="352">Boost button</text>
  <text class="small" x="38" y="367">(or I2C signal)</text>

  <rect class="box" x="250" y="330" width="170" height="46" />
  <text class="label" x="264" y="352">Thruster Arduino</text>

  <rect class="box" x="476" y="312" width="170" height="40" />
  <text class="label" x="490" y="337">Thruster LEDs (boost)</text>

  <rect class="box" x="476" y="362" width="170" height="46" />
  <text class="label" x="490" y="384">MicroFogger</text>
  <text class="small" x="490" y="399">own battery</text>

  <line class="line" x1="194" y1="353" x2="250" y2="353" marker-end="url(#arrow)" />
  <text class="small" x="196" y="348">press</text>
  <line class="line" x1="420" y1="345" x2="476" y2="332" marker-end="url(#arrow)" />
  <line class="line" x1="420" y1="361" x2="476" y2="384" marker-end="url(#arrow)" />
  <text class="small" x="424" y="380">FOGGER_PIN</text>

  <!-- ================= POWER RAILS ================= -->
  <line x1="0" y1="440" x2="980" y2="440" stroke="#ccc" stroke-width="1" />
  <text class="zone" x="24" y="466">POWER RAILS (backpack)</text>

  <rect class="pwr" x="24" y="486" width="180" height="150" />
  <text class="label" x="40" y="540">Akku / Powerbank</text>
  <text class="small" x="40" y="558">(Backpack)</text>

  <rect class="box" x="320" y="486" width="300" height="40" />
  <text class="label" x="334" y="511">Rail 1: Pi 5 / AR / Sensors</text>
  <rect class="box" x="320" y="538" width="300" height="40" />
  <text class="label" x="334" y="563">Rail 2: LEDs / Mist / Fans</text>
  <rect class="box" x="320" y="590" width="300" height="40" />
  <text class="label" x="334" y="615">Rail 3: Audio</text>

  <line class="line" x1="204" y1="520" x2="320" y2="506" marker-end="url(#arrow)" />
  <text class="small" x="232" y="500">fuse 3A</text>
  <line class="line" x1="204" y1="558" x2="320" y2="558" marker-end="url(#arrow)" />
  <text class="small" x="232" y="552">fuse 5-10A</text>
  <line class="line" x1="204" y1="596" x2="320" y2="610" marker-end="url(#arrow)" />
  <text class="small" x="232" y="628">fuse 2A</text>

  <rect class="note" x="664" y="520" width="292" height="86" />
  <text class="small" x="678" y="544">MicroFogger runs on its OWN battery -</text>
  <text class="small" x="678" y="562">the 40W heat load stays OFF these rails.</text>
  <text class="small" x="678" y="580">The suit sends only the trigger signal.</text>
  <text class="small" x="678" y="598">Rail separation prevents Pi brownouts.</text>
</svg>
